name: Refresh profile assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile.yml'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *'
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh public statistics
        run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Commit updated assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard-*.svg assets/language-orbit-*.svg assets/landscape-*.svg profile-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile statistics'
            git push
          fi
