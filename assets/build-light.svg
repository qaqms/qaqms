<svg xmlns="http://www.w3.org/2000/svg" width="880" height="448" viewBox="0 0 880 448" role="img"><title>What I build: AI 角色陪伴系统 (Companion AI): 情绪模型、身体节律、日记式长期记忆，好感与关系阶段，让角色像在“生活”。 LLM Agent 工程 (Agents): 自然语言下任务 → 自主拆解、规划、调用工具，通过 HTTP / SSE / MCP 任务桥接入宿主。 插件全栈交付 (Full-stack Plugins): Python 后端 + TS/TSX 面板 + 宿主存储，从数据模型到交互界面一个人交付。 3D 交互场景 (Interactive 3D): 角色行走、坐下、转身的细节动画，Blender 布料模拟烘焙进可漫游的小屋。</title><style>text{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif;letter-spacing:0}.mono{font-family:Consolas,'SFMono-Regular',Menlo,'Microsoft YaHei',monospace}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="879" height="447" rx="14" fill="#f4f9fe" stroke="#d6e6f5"/><text x="32" y="46" font-size="22" fill="#1f2d3d" font-weight="700" >What I build</text><text x="176" y="46" font-size="13" fill="#62758a" >能力方向，而不是项目列表</text><rect x="32" y="70" width="400" height="160" rx="12" fill="#eaf3fc" stroke="#d6e6f5"/><rect x="50" y="88" width="40" height="40" rx="10" fill="#5fa8e0" opacity=".18"/><path transform="translate(58 96)" d="M12 20s-8-4.6-8-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 8 2.8C20 15.4 12 20 12 20z" fill="#5fa8e0"/><text x="104" y="106" font-size="17" fill="#1f2d3d" font-weight="700" >AI 角色陪伴系统</text><text x="104" y="125" font-size="12" fill="#62758a" font-weight="600" >Companion AI</text><text x="52" y="158" font-size="13" fill="#1f2d3d" >情绪模型、身体节律、日记式长期记忆，</text><text x="52" y="179" font-size="13" fill="#1f2d3d" >好感与关系阶段，让角色像在“生活”。</text><rect x="52" y="194" width="61.2" height="22" rx="11" fill="#dceaf7"/><text x="82.6" y="209" font-size="11" fill="#2f7fc1" font-weight="600" text-anchor="middle" >Python</text><rect x="121.2" y="194" width="39.6" height="22" rx="11" fill="#dceaf7"/><text x="141" y="209" font-size="11" fill="#2f7fc1" font-weight="600" text-anchor="middle" >LLM</text><rect x="168.8" y="194" width="61.2" height="22" rx="11" fill="#dceaf7"/><tex